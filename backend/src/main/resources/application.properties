spring.application.name=parallax-backend

# Container-friendly: bind to 0.0.0.0, port overridable via PORT env var
server.address=0.0.0.0
server.port=${PORT:8080}

# CORS origin for the Streamlit frontend (Track B), overridable per environment
parallax.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:8501}

management.endpoints.web.exposure.include=health,info
